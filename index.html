<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Weather App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styleSheets.css">
</head>
<body>
    <p id="city"></p>
    <article id="box">
        <!-- Separate inputs for City and State -->
        <input type="text" id="cityInput" placeholder="Enter city...">
        <input type="text" id="stateInput" placeholder="Enter state (e.g. MO)...">
        <button id="searchButton">Search</button>

        <p id="activeAlerts"></p>
        <p id="temp"></p>
        <p id="wind"></p>
        <p id="windDirection"></p>
        <p id="dewPoint"></p>
       
        <button id="refreshData">Refresh Data</button>
    </article>

    <!-- THIS IS THE SCRIPT LINK -->
    <script src="js.js"></script>
</body>
</html>
